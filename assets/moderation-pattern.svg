<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Layered moderation workflow</title>
  <desc id="desc">A conversation stream enters a high-recall classifier. Candidate conversations flow to a policy-based LLM agent and then human review. Classifier scores can also be used directly for queue triage and prioritization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#51657D"/>
    </marker>
    <style>
      .title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172436}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5B6B7E}
      .stage{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:1.2px;fill:#37638F}
      .heading{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172436}
      .body{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#516174}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#43566C}
      .number{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#FFFFFF}
      .line{fill:none;stroke:#51657D;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="1" y="1" width="1438" height="418" rx="18" fill="#F4F8FE" stroke="#BDD0E6" stroke-width="2"/>
  <text x="40" y="43" class="title">Layered moderation workflow</text>
  <text x="40" y="68" class="subtitle">The classifier supplies candidates; policy reasoning and human judgment remain separate controls.</text>

  <rect x="38" y="114" width="230" height="158" rx="14" fill="#FFFFFF" stroke="#91A6BC" stroke-width="2"/>
  <circle cx="68" cy="143" r="15" fill="#627990"/>
  <text x="68" y="148" text-anchor="middle" class="number">1</text>
  <text x="68" y="190" class="heading">Conversation</text>
  <text x="68" y="216" class="heading">stream</text>
  <text x="68" y="246" class="body">Full thread context</text>

  <rect x="330" y="96" width="265" height="194" rx="14" fill="#DFECFC" stroke="#6F9FD2" stroke-width="2.2"/>
  <rect x="352" y="118" width="86" height="26" rx="13" fill="#C6DCF5"/>
  <text x="395" y="136" text-anchor="middle" class="stage">STAGE 1</text>
  <text x="352" y="181" class="heading">High-recall ML</text>
  <text x="352" y="207" class="heading">classifier</text>
  <text x="352" y="237" class="body">Risk score + ranking</text>
  <text x="352" y="261" class="body">Candidate sourcing</text>

  <rect x="676" y="96" width="265" height="194" rx="14" fill="#DFECFC" stroke="#6F9FD2" stroke-width="2.2"/>
  <rect x="698" y="118" width="86" height="26" rx="13" fill="#C6DCF5"/>
  <text x="741" y="136" text-anchor="middle" class="stage">STAGE 2</text>
  <text x="698" y="181" class="heading">Policy-based</text>
  <text x="698" y="207" class="heading">LLM agent</text>
  <text x="698" y="237" class="body">Structured analysis</text>
  <text x="698" y="261" class="body">Policy-grounded rationale</text>

  <rect x="1022" y="96" width="265" height="194" rx="14" fill="#FFF0DA" stroke="#D59A3A" stroke-width="2.2"/>
  <rect x="1044" y="118" width="86" height="26" rx="13" fill="#F7DCAA"/>
  <text x="1087" y="136" text-anchor="middle" class="stage" fill="#845811">STAGE 3</text>
  <text x="1044" y="181" class="heading">Human review</text>
  <text x="1044" y="213" class="body">Policy decision</text>
  <text x="1044" y="237" class="body">Contextual judgment</text>
  <text x="1044" y="261" class="body">Escalation or closure</text>

  <path d="M268 193 H330" class="line"/>
  <path d="M595 193 H676" class="line"/>
  <path d="M941 193 H1022" class="line"/>
  <text x="635" y="178" text-anchor="middle" class="label">Candidate set</text>
  <text x="981" y="178" text-anchor="middle" class="label">Escalations</text>

  <path d="M463 290 V326 H706" class="line"/>
  <rect x="716" y="310" width="338" height="74" rx="12" fill="#FFFFFF" stroke="#8FA4BA" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="738" y="340" class="heading" font-size="18">Queue triage + prioritization</text>
  <text x="738" y="365" class="body">Optional standalone use of ranked scores</text>
  <text x="514" y="319" class="label">Ranked scores</text>
</svg>
