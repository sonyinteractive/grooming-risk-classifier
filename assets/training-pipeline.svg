<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">High-level model development pipeline</title>
  <desc id="desc">Labeled conversations are prepared and used to train candidate models. Ranking-oriented held-out evaluation and error review guide refinement before tokenizer, model weights, and configuration are exported as the public artifact. Training data is not included.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#51657D"/>
    </marker>
    <style>
      .title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172436}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5B6B7E}
      .boundary{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:1.4px;fill:#64778D}
      .heading{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172436}
      .body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#516174}
      .number{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#FFFFFF}
      .label{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#52667C}
      .line{fill:none;stroke:#51657D;stroke-width:2;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#C68B2E;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="1" y="1" width="1438" height="428" rx="18" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="2"/>
  <text x="40" y="43" class="title">Model development at a glance</text>
  <text x="40" y="68" class="subtitle">Model development and evaluation produce a validated public artifact; implementation details and data are not included.</text>

  <rect x="28" y="92" width="1135" height="286" rx="16" fill="#F4F8FE" stroke="#94ABC4" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="54" y="80" width="224" height="26" rx="13" fill="#E5EEF8"/>
  <text x="166" y="98" text-anchor="middle" class="boundary">MODEL DEVELOPMENT</text>

  <rect x="54" y="133" width="220" height="174" rx="13" fill="#FFFFFF" stroke="#91A6BC" stroke-width="2"/>
  <circle cx="80" cy="159" r="13" fill="#627990"/>
  <text x="80" y="163" text-anchor="middle" class="number">1</text>
  <text x="78" y="204" class="heading">Labeled conversations</text>
  <text x="78" y="242" class="body">Quality checks</text>
  <text x="78" y="265" class="body">Label review</text>

  <rect x="315" y="133" width="235" height="174" rx="13" fill="#DFECFC" stroke="#6F9FD2" stroke-width="2"/>
  <circle cx="341" cy="159" r="13" fill="#5E8FC2"/>
  <text x="341" y="163" text-anchor="middle" class="number">2</text>
  <text x="339" y="204" class="heading">Conversation preparation</text>
  <text x="339" y="240" class="body">Ordered turns</text>
  <text x="339" y="263" class="body">Standardized speakers</text>
  <text x="339" y="286" class="body">Context limits</text>

  <rect x="591" y="133" width="235" height="174" rx="13" fill="#DFECFC" stroke="#6F9FD2" stroke-width="2"/>
  <circle cx="617" cy="159" r="13" fill="#5E8FC2"/>
  <text x="617" y="163" text-anchor="middle" class="number">3</text>
  <text x="615" y="204" class="heading">Candidate model training</text>
  <text x="615" y="240" class="body">Sentence encoder +</text>
  <text x="615" y="263" class="body">classification head</text>
  <text x="615" y="286" class="body">Imbalance-aware objective</text>

  <rect x="867" y="121" width="270" height="198" rx="13" fill="#FFF0DA" stroke="#D59A3A" stroke-width="2"/>
  <circle cx="893" cy="147" r="13" fill="#C98A27"/>
  <text x="893" y="151" text-anchor="middle" class="number">4</text>
  <text x="891" y="192" class="heading">Ranking-oriented validation</text>
  <text x="891" y="228" class="body">Held-out evaluation</text>
  <text x="891" y="251" class="body">AUPRC + review-rate metrics</text>
  <text x="891" y="274" class="body">Error analysis</text>
  <text x="891" y="297" class="body">Refine candidate recipe</text>

  <path d="M274 220 H315" class="line"/>
  <path d="M550 220 H591" class="line"/>
  <path d="M826 220 H867" class="line"/>

  <path d="M1002 319 V349 H709 V307" class="feedback"/>
  <text x="855" y="365" text-anchor="middle" class="label">Review + refine</text>

  <rect x="1210" y="121" width="196" height="198" rx="14" fill="#E7F5EA" stroke="#57A36A" stroke-width="2.4"/>
  <rect x="1232" y="143" width="152" height="26" rx="13" fill="#CDE8D3"/>
  <text x="1308" y="161" text-anchor="middle" class="boundary" fill="#367546">PUBLIC RELEASE</text>
  <text x="1232" y="211" class="heading">Model artifact</text>
  <text x="1232" y="247" class="body">Tokenizer</text>
  <text x="1232" y="270" class="body">Model weights</text>
  <text x="1232" y="293" class="body">Configuration</text>

  <path d="M1137 220 H1210" class="line"/>
  <text x="1174" y="204" text-anchor="middle" class="label">export</text>

  <rect x="1210" y="343" width="196" height="36" rx="9" fill="#F4FAF5" stroke="#91C29C"/>
  <text x="1308" y="366" text-anchor="middle" class="body">No training data included</text>
</svg>
