<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-labelledby="title desc">
  <title id="title">Policy-based LLM integration</title>
  <desc id="desc">Classifier output is minimized and sanitized before entering a policy-constrained prompt. The LLM returns structured analysis for review. Proposed prompt changes undergo simulation testing and review before rollout.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#51657D"/>
    </marker>
    <style>
      .title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172436}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5B6B7E}
      .step{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:1.1px;fill:#37638F}
      .heading{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#172436}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#516174}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#43566C}
      .number{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#FFFFFF}
      .line{fill:none;stroke:#51657D;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="1" y="1" width="1438" height="408" rx="18" fill="#F4F8FE" stroke="#BDD0E6" stroke-width="2"/>
  <text x="40" y="43" class="title">Policy-based LLM integration</text>
  <text x="40" y="68" class="subtitle">Only minimized, policy-relevant context crosses the LLM boundary; outputs remain advisory.</text>

  <rect x="38" y="120" width="230" height="168" rx="14" fill="#FFFFFF" stroke="#91A6BC" stroke-width="2"/>
  <circle cx="64" cy="145" r="14" fill="#627990"/>
  <text x="64" y="150" text-anchor="middle" class="number">1</text>
  <text x="60" y="190" class="heading">Classifier output</text>
  <text x="60" y="222" class="body">Candidate conversation</text>
  <text x="60" y="246" class="body">Risk score + rank</text>

  <rect x="315" y="102" width="250" height="204" rx="14" fill="#FFF5E6" stroke="#D69A36" stroke-width="2.4" stroke-dasharray="8 6"/>
  <rect x="337" y="124" width="72" height="26" rx="13" fill="#F7DCAA"/>
  <text x="373" y="142" text-anchor="middle" class="step" fill="#805612">GATE</text>
  <text x="337" y="188" class="heading">Sanitize + minimize</text>
  <text x="337" y="221" class="body">Remove direct identifiers</text>
  <text x="337" y="245" class="body">Trim unnecessary quotes</text>
  <text x="337" y="269" class="body">Retain policy signals</text>

  <rect x="612" y="120" width="230" height="168" rx="14" fill="#DFECFC" stroke="#6F9FD2" stroke-width="2.2"/>
  <circle cx="638" cy="145" r="14" fill="#5E8FC2"/>
  <text x="638" y="150" text-anchor="middle" class="number">2</text>
  <text x="634" y="190" class="heading">Policy-constrained</text>
  <text x="634" y="216" class="heading">prompt</text>
  <text x="634" y="248" class="body">Scoped instructions</text>
  <text x="634" y="272" class="body">Structured JSON schema</text>

  <rect x="889" y="120" width="230" height="168" rx="14" fill="#DFECFC" stroke="#6F9FD2" stroke-width="2.2"/>
  <circle cx="915" cy="145" r="14" fill="#5E8FC2"/>
  <text x="915" y="150" text-anchor="middle" class="number">3</text>
  <text x="911" y="190" class="heading">Structured analysis</text>
  <text x="911" y="222" class="body">Signals + rationale</text>
  <text x="911" y="246" class="body">Risk level + urgency</text>
  <text x="911" y="270" class="body">Human-escalation flag</text>

  <rect x="1166" y="102" width="236" height="204" rx="14" fill="#FFF0DA" stroke="#D59A3A" stroke-width="2.2"/>
  <circle cx="1192" cy="127" r="14" fill="#C98A27"/>
  <text x="1192" y="132" text-anchor="middle" class="number">4</text>
  <text x="1188" y="172" class="heading">Review workflow</text>
  <rect x="1188" y="194" width="192" height="40" rx="8" fill="#FFFFFF" stroke="#D7A95F"/>
  <text x="1284" y="219" text-anchor="middle" class="label">Prioritize review queue</text>
  <rect x="1188" y="244" width="192" height="40" rx="8" fill="#FFFFFF" stroke="#D7A95F"/>
  <text x="1284" y="269" text-anchor="middle" class="label">Escalate to a human</text>

  <path d="M268 204 H315" class="line"/>
  <path d="M565 204 H612" class="line"/>
  <path d="M842 204 H889" class="line"/>
  <path d="M1119 204 H1166" class="line"/>

  <rect x="315" y="329" width="827" height="54" rx="11" fill="#FFF8EC" stroke="#D69A36" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="337" y="351" class="step" fill="#805612">PROMPT CHANGE CONTROL</text>
  <text x="337" y="372" class="label">Propose update  →  simulation tests  →  review + approve  →  rollout</text>
  <path d="M727 329 V288" fill="none" stroke="#C68B2E" stroke-width="1.8" stroke-dasharray="5 4"/>
</svg>
